# nginx site for the game; see "Deploying" in README.md.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/bs26.pohjoiseen.fi
#          sudo ln -s ../sites-available/bs26.pohjoiseen.fi /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d bs26.pohjoiseen.fi   (adds HTTPS and the redirect to it)

upstream battleships {
    # PORT in battleships.service
    server 127.0.0.1:3026;
}

server {
    listen 80;
    listen [::]:80;
    server_name bs26.pohjoiseen.fi;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://battleships;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The game's WebSocket. It can be quiet for minutes while a player thinks, longer than
    # nginx's default 60 s timeout.
    location = /ws {
        proxy_pass http://battleships;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
