<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Battleships</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="game">
    <canvas id="screen"></canvas>
    <div id="invite" hidden>
      <span>SEND THIS LINK TO PLAYER 2:</span>
      <input id="invite-link" readonly aria-label="Invite link for player 2" />
      <button id="invite-copy" type="button">COPY</button>
      <button id="invite-share" type="button" hidden>SHARE</button>
    </div>
    <form id="name-entry" hidden>
      <label for="name">YOUR NAME FOR THE HI-SCORES:</label>
      <input
        id="name"
        maxlength="12"
        autocomplete="nickname"
        autocapitalize="characters"
        spellcheck="false"
        enterkeyhint="done"
      />
      <button type="submit">OK</button>
    </form>
    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
