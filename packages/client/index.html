<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Battleships</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body class="landing">
    <h1 class="sr-only">Battle Ships</h1>
    <div class="stage">
      <canvas id="screen" aria-hidden="true"></canvas>
      <nav id="menu" aria-label="Menu">
        <button type="button">1 PLAYER</button>
        <button type="button">2 PLAYERS</button>
        <button type="button">COMPUTER - 1987</button>
        <button type="button" aria-pressed="true">SALVO FIRE - ON</button>
        <button type="button" aria-pressed="true">SOUND - ON</button>
        <button type="button">HI-SCORES</button>
      </nav>
      <nav id="scores" aria-label="Hi-scores" hidden>
        <button type="button">PREVIOUS TABLE</button>
        <button type="button">NEXT TABLE</button>
        <button type="button">BACK</button>
      </nav>
    </div>
    <p id="status" class="sr-only" role="status"></p>
    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
